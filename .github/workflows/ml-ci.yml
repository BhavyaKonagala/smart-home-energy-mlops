name: Smart Home Energy ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:

      # 1. Get project code
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Train Smart Home ML model
      - name: Train Smart Home ML model
        run: python train_model.py

      # 5. Check model quality
      - name: Run ML quality gate
        run: python quality_gate.py

      # 6. Run ML pipeline tests
      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      # 7. Run Flask API tests
      - name: Run Flask API tests
        run: python -m unittest test_app.py -v

      # 8. Preserve ML artifacts
      - name: Upload Smart Home ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-home-energy-ml-artifacts
          path: |
            smart_home_energy_model.pkl
            metrics.json
            smart_home_energy_processed.csv
          retention-days: 7

      # 9. Prepare release candidate
      - name: Prepare release candidate
        run: |
          mkdir release_candidate
          cp app.py release_candidate/
          cp smart_home_energy_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp test_app.py release_candidate/

          echo "Smart Home Energy ML Release Candidate" > release_candidate/DEPLOYMENT.txt
          echo "Model: smart_home_energy_model.pkl" >> release_candidate/DEPLOYMENT.txt
          echo "API: Flask on port 5000" >> release_candidate/DEPLOYMENT.txt
          echo "Quality Gate: Passed" >> release_candidate/DEPLOYMENT.txt

      # 10. Upload release candidate
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: smart-home-energy-ml-release
          path: release_candidate/
          retention-days: 7
